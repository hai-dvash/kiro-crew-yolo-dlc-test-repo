<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MAXXED 3D Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="app" aria-label="3D Rock Paper Scissors">
      <header class="hud">
        <h1>Rock · Paper · Scissors <small>— maxxed</small></h1>
        <p id="status" role="status" aria-live="polite">Loading…</p>
        <p id="badge" class="badge" role="alert" hidden></p>
      </header>
      <p class="hint">
        Keyboard: press <kbd>R</kbd> / <kbd>P</kbd> / <kbd>S</kbd>, or use the buttons below.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
