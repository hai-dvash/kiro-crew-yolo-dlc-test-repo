<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Rock-Paper-Scissors — gesture throws</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #10131a;
        color: #e8ecf4;
        overflow: hidden;
      }
      #play {
        position: fixed;
        inset: 0;
        touch-action: none; /* let pointer events drive the gesture, not scroll */
        cursor: grab;
      }
      #play:active { cursor: grabbing; }
      #hud {
        position: fixed;
        top: 16px;
        left: 0;
        right: 0;
        text-align: center;
        pointer-events: none;
        font-size: 22px;
        font-weight: 600;
        text-shadow: 0 1px 4px #000;
      }
      #hint {
        position: fixed;
        bottom: 84px;
        left: 0;
        right: 0;
        text-align: center;
        pointer-events: none;
        opacity: 0.7;
        font-size: 14px;
      }
      #badge {
        display: none;
        margin: 8px auto 0;
        padding: 4px 10px;
        border-radius: 999px;
        background: #b9770066;
        border: 1px solid #f0a020;
        font-size: 13px;
        width: max-content;
      }
      #badge.show { display: block; }
      #fallback {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      #fallback button {
        font-size: 16px;
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid #3a4152;
        background: #1c2230;
        color: #e8ecf4;
        cursor: pointer;
      }
      #fallback button:hover { background: #262e40; }
      #fallback button:focus-visible { outline: 2px solid #6ea8ff; }
    </style>
  </head>
  <body>
    <canvas id="play" aria-label="Play area: press and flick to throw"></canvas>
    <div id="hud" role="status" aria-live="polite">Press &amp; flick in the arena to throw</div>
    <div id="badge">Low confidence — re-throw or use a button</div>
    <div id="hint">Rock = sharp down-flick · Paper = flat sweep · Scissors = quick zig-zag</div>
    <div id="fallback" aria-label="Accessible shape picker">
      <button data-shape="rock" type="button">✊ Rock</button>
      <button data-shape="paper" type="button">✋ Paper</button>
      <button data-shape="scissors" type="button">✌ Scissors</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
